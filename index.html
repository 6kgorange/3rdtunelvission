<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>TWINZY 周邊試算</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5}
header{background:#111;color:#fff;text-align:center;padding:14px}
header select{margin-top:8px;padding:6px;font-size:15px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:14px}
.card{background:#fff;border-radius:10px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:#eee}
.name{font-size:13px;margin:6px 0;min-height:32px}
.card input{width:100%;padding:6px;font-size:14px}
.summary{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;padding:12px;text-align:center}
.summary div{margin:4px 0;font-size:16px}
</style>
</head>

<body>

<header>
  <h3>TWINZY 周邊試算</h3>
  <select id="mode">
    <option value="early">早鳥線上</option>
    <option value="offline">線下</option>
    <option value="presale">線上預售</option>
    <option value="krw">韓幣</option>
  </select>
</header>

<div id="products" class="products"></div>

<div class="summary">
  <div>總數量：<span id="totalQty">0</span></div>
  <div>顯示金額：<span id="totalPrice">0</span></div>
  <div>韓幣滿額卡：<span id="bonus">0</span> 張</div>
</div>

<script>
const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQiwyUYwisLGMaEdGumfanbDofdtZT1rnagpF5pt2as1noClta4z-yCb8VcvvMwfvGxLP3j9XAxijcl/pub?gid=2102212403&single=true&output=csv";

let items=[];

function parseCSV(t){
  const r=[];let row=[],c="",q=false;
  for(let i=0;i<t.length;i++){
    const x=t[i],n=t[i+1];
    if(x=='"'&&q&&n=='"'){c+='"';i++}
    else if(x=='"'){q=!q}
    else if(x==","&&!q){row.push(c);c=""}
    else if(x=="\n"&&!q){row.push(c);r.push(row);row=[];c=""}
    else c+=x
  }
  if(c) row.push(c);
  if(row.length) r.push(row);
  return r;
}

fetch(CSV_URL)
.then(r=>r.text())
.then(t=>{
  parseCSV(t).slice(1).forEach(r=>{
    if(!r[1]) return;
    items.push({
      name:r[1],
      img:r[2],
      early:+r[3]||0,
      offline:+r[4]||0,
      presale:+r[5]||0,
      krw:+r[6]||0,
      qty:0
    });
  });
  render();
});

function render(){
  const b=document.getElementById("products");
  b.innerHTML="";
  items.forEach((p,i)=>{
    b.innerHTML+=`
    <div class="card">
      <img src="${p.img}">
      <div class="name">${p.name}</div>
      <input type="number" min="0" value="0"
        oninput="items[${i}].qty=this.valueAsNumber||0;calc()">
    </div>`;
  });
}

document.getElementById("mode").onchange=calc;

function calc(){
  let qty=0;
  let display=0;
  let krwForBonus=0;
  const m=document.getElementById("mode").value;

  items.forEach(p=>{
    qty+=p.qty;

    // 顯示金額
    if(m==="early")   display+=p.qty*p.early;
    if(m==="offline") display+=p.qty*p.offline;
    if(m==="presale") display+=p.qty*p.presale;
    if(m==="krw")     display+=p.qty*p.krw;

    // 韓幣滿額計算規則
    if(m==="early" && p.early>0){
      krwForBonus+=p.qty*p.krw;
    }
    if(m==="offline" && p.offline>0){
      krwForBonus+=p.qty*p.krw;
    }
    if(m==="presale"){
      krwForBonus+=p.qty*p.krw;
    }
    if(m==="krw"){
      krwForBonus+=p.qty*p.krw;
    }
  });

  totalQty.innerText=qty;
  totalPrice.innerText=(m==="krw"?"₩ ":"NT$ ")+display.toLocaleString();
  bonus.innerText=Math.floor(krwForBonus/50000);
}
</script>

</body>
</html>
