<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;
  font-size:14px;
}

/* Header */
header{
  background:#111;
  color:#fff;
  text-align:center;
  padding:10px
}
header h3{
  margin:4px 0;
}
header select{
  margin-top:6px;
  padding:4px;
  font-size:14px
}

/* 商品區 */
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr); /* 手機 */
  gap:10px;
  padding:10px;
  max-width:1600px;
  margin:0 auto;
}

/* 卡片 */
.card{
  background:#fff;
  border-radius:10px;
  padding:6px;
  box-shadow:0 1px 4px rgba(0,0,0,.08)
}

/* 圖片：關鍵縮小 */
.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:6px;
  background:#eee
}

/* 文字 */
.name{
  font-size:12px;
  margin:4px 0;
  min-height:28px;
  line-height:1.2;
}

/* 數量輸入 */
.card input{
  width:100%;
  padding:4px;
  font-size:14px
}

/* Summary：不吃畫面 */
.summary{
  position:sticky;
  bottom:0;
  background:#fff;
  border-top:1px solid #ddd;
  padding:6px;
  text-align:center;
  font-size:14px;
}
.summary div{
  margin:2px 0;
}

/* 📱 平板 */
@media (min-width:768px){
  .products{
    grid-template-columns:repeat(4,1fr);
  }
}

/* 💻 桌機：重點 */
@media (min-width:1200px){
  .products{
    grid-template-columns:repeat(6,1fr); /* 一次看完 */
    gap:12px;
  }

  body{
    font-size:13px;
  }

  .card{
    padding:5px;
  }

  .name{
    font-size:11px;
    min-height:24px;
  }
}

/* 🖥 超寬螢幕 */
@media (min-width:1600px){
  .products{
    grid-template-columns:repeat(8,1fr);
  }
}
</style>
