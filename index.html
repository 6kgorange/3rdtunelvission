<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>TWINZY 周邊試算</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5}
header{background:#111;color:#fff;text-align:center;padding:14px}
header select{margin-top:8px;padding:6px;font-size:15px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:14px}
.card{background:#fff;border-radius:10px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:#eee}
.name{font-size:13px;margin:6px 0;min-height:32px}
.card input{width:100%;padding:6px;font-size:14px}
.summary{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;padding:12px;text-align:center}
.summary div{margin:4px 0;font-size:16px}
</style>
</head>

<body>

<header>
  <h3>TWINZY 周邊試算</h3>
  <select id="mode">
    <option value="early">早鳥線上</option>
    <option value="offline">線下</option>
    <option value="presale">線上預售</option>
    <option value="krw">韓幣</option>
  </select>
</header>

<div id="products" class="products"></div>

<div class="summary">
  <div>總數量：<span id="totalQty">0</span></div>
  <div>總金額：<span id="totalPrice">NT$ 0</span></div>
  <div>滿額卡：<span id="bonus">0</span> 張</div>
</div>

<script>
const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQiwyUYwisLGMaEdGumfanbDofdtZT1rnagpF5pt2as1noClta4z-yCb8VcvvMwfvGxLP3j9XAxijcl/pub?gid=2102212403&single=true&output=csv";

let items = [];

// 🔥 不管你丟什麼 Google Drive 連結，都轉成能顯示的
function normalizeImage(url){
  if(!url) return "";
  url = String(url).replace(/^"|"$/g,"").trim();
  if(url.includes("drive.google.com")){
    const m = url.match(/[-\w]{25,}/);
    if(m) return "https://drive.google.com/uc?export=view&id=" + m[0];
  }
  return url;
}

// 穩定 CSV 解析
function parseCSV(text){
  const rows=[]; let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(c=='"'&&q&&n=='"'){cur+='"';i++}
    else if(c=='"'){q=!q}
    else if(c==","&&!q){row.push(cur);cur=""}
    else if(c=="\n"&&!q){row.push(cur);rows.push(row);row=[];cur=""}
    else cur+=c
  }
  if(cur) row.push(cur);
  if(row.length) rows.push(row);
  return rows;
}

fetch(CSV_URL)
  .then(r=>r.text())
  .then(t=>{
    const data=parseCSV(t);
    data.slice(1).forEach(r=>{
      if(!r[1]) return;
      items.push({
        name: r[1],
        img: normalizeImage(r[2]),
        early: Number(r[3])||0,
        offline: Number(r[4])||0,
        presale: Number(r[5])||0,
        krw: Number(r[6])||0,
        qty: 0
      });
    });
    render();
  });

function render(){
  const box=document.getElementById("products");
  box.innerHTML="";
  items.forEach((p,i)=>{
    box.innerHTML+=`
      <div class="card">
        <img src="${p.img}" onerror="this.src='https://via.placeholder.com/300?text=NO+IMAGE'">
        <div class="name">${p.name}</div>
        <input type="number" min="0" value="0" oninput="setQty(${i},this.value)">
      </div>`;
  });
}

function setQty(i,v){
  items[i].qty=Number(v)||0; calc();
}
document.getElementById("mode").onchange=calc;

function calc(){
  let q=0,t=0,k=0,m=document.getElementById("mode").value;
  items.forEach(p=>{
    q+=p.qty; k+=p.qty*p.krw;
    if(m=="early")t+=p.qty*p.early;
    if(m=="offline")t+=p.qty*p.offline;
    if(m=="presale")t+=p.qty*p.presale;
    if(m=="krw")t+=p.qty*p.krw;
  });
  totalQty.innerText=q;
  totalPrice.innerText=(m=="krw"?"₩ ":"NT$ ")+t.toLocaleString();
  bonus.innerText=Math.floor(k/50000);
}
</script>

</body>
</html>
