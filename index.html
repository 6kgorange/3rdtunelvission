<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>TWINZY 周邊試算</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:#f7f7f7;
  margin:0;
}
header {
  background:#111;
  color:#fff;
  padding:16px;
  text-align:center;
}
header select {
  margin-top:10px;
  padding:6px;
  font-size:16px;
}
.products {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap:16px;
  padding:16px;
}
.card {
  background:#fff;
  border-radius:10px;
  padding:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.card img {
  width:100%;
  border-radius:8px;
}
.card .name {
  font-size:14px;
  margin:6px 0;
}
.card input {
  width:100%;
  padding:6px;
  font-size:14px;
}
.summary {
  position:sticky;
  bottom:0;
  background:#fff;
  padding:14px;
  border-top:1px solid #ddd;
  text-align:center;
}
.summary div {
  margin:4px 0;
  font-size:16px;
}
</style>
</head>

<body>

<header>
  <h2>TWINZY 周邊試算</h2>
  <select id="mode">
    <option value="early">,早鳥線上</option>
    <option value="offline">線下</option>
    <option value="presale">線上預售</option>
    <option value="krw">韓幣</option>
  </select>
</header>

<div class="products" id="products"></div>

<div class="summary">
  <div>總數量：<span id="totalQty">0</span></div>
  <div>總金額：<span id="totalPrice">0</span></div>
  <div>滿額卡：<span id="bonus">0</span> 張</div>
</div>

<script>
// ⬇⬇⬇ 之後你只要改這一行 ⬇⬇⬇
const CSV_URL = "請先貼上你的CSV連結";

let items = [];

fetch(CSV_URL)
  .then(res => res.text())
  .then(text => {
    const rows = text.split("\n").slice(1);
    items = rows.map(r => {
      const c = r.split(",");
      return {
        name: c[1],
        img: c[2],
        early: +c[3],
        offline: +c[4],
        presale: +c[5],
        krw: +c[6],
        qty: 0
      };
    });
    render();
  });

function render() {
  const wrap = document.getElementById("products");
  wrap.innerHTML = "";
  items.forEach((p,i)=>{
    wrap.innerHTML += `
      <div class="card">
        <img src="${p.img}">
        <div class="name">${p.name}</div>
        <input type="number" min="0" value="0"
          oninput="updateQty(${i},this.value)">
      </div>
    `;
  });
}

function updateQty(i,val){
  items[i].qty = +val || 0;
  calc();
}

document.getElementById("mode").onchange = calc;

function calc(){
  let qty=0, total=0, totalKrw=0;
  const mode = document.getElementById("mode").value;

  items.forEach(p=>{
    qty += p.qty;
    totalKrw += p.qty * p.krw;
    if(mode==="early") total += p.qty * p.early;
    if(mode==="offline") total += p.qty * p.offline;
    if(mode==="presale") total += p.qty * p.presale;
    if(mode==="krw") total += p.qty * p.krw;
  });

  document.getElementById("totalQty").innerText = qty;
  document.getElementById("totalPrice").innerText =
    (mode==="krw" ? "₩ " : "NT$ ") + total.toLocaleString();
  document.getElementById("bonus").innerText =
    Math.floor(totalKrw / 50000);
}
</script>

</body>
</html>
