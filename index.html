<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;
  font-size:clamp(14px,1.2vw,16px);
}

/* Header */
header{
  background:#111;
  color:#fff;
  text-align:center;
  padding:14px
}
header select{
  margin-top:8px;
  padding:6px;
  font-size:15px
}

/* 主容器：關鍵 */
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
  max-width:1200px;   /* 桌機不爆 */
  margin:0 auto;      /* 置中 */
}

/* 卡片 */
.card{
  background:#fff;
  border-radius:12px;
  padding:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08)
}
.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:10px;
  background:#eee
}
.name{
  font-size:13px;
  margin:6px 0;
  min-height:32px
}
.card input{
  width:100%;
  padding:6px;
  font-size:15px
}

/* Summary */
.summary{
  position:sticky;
  bottom:0;
  background:#fff;
  border-top:1px solid #ddd;
  padding:12px;
  text-align:center;
  max-width:1200px;   /* 不跟著爆 */
  margin:0 auto;
}
.summary div{
  margin:4px 0;
  font-size:16px
}

/* ✅ 平板 */
@media (min-width:768px){
  .products{
    grid-template-columns:repeat(3,1fr);
    gap:16px;
  }
}

/* ✅ 桌機 */
@media (min-width:1024px){
  .products{
    grid-template-columns:repeat(4,1fr);
    gap:20px;
  }
}
</style>
